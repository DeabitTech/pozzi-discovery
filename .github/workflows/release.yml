name: Build and Release Windows App

on:
  push:
    tags:
      - 'v*' # Si attiva automaticamente quando pushi un tag (es. v1.0.0)
  workflow_dispatch: # Permette anche di avviarla manualmente dal sito di GitHub

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write # Permesso necessario per creare la Release su GitHub

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Versione stabile di Node

      - name: Installazione Dipendenze
        run: npm install

      - name: Build e Pacchettizzazione
        run: |
          npm run build
          npx electron-builder --win

      - name: Carica l'eseguibile nei risultati (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: pozzi-discovery-windows-exe
          path: dist/*.exe

      - name: Crea la GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
